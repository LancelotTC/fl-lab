hyperparameters:
    client:
        clipping: 1.0
        batch_size: 256
        local_epochs: 5
        loss: MultiMarginLoss
        optimizer:
            lr: 0.001
            momentum: 0.9
            weight_decay: 1.0e-03
        persistency: true
        scheduler:
            gamma: 1
            step_size: 1
    model: Medical_SVM
    net_args:
        input_dim: 26
    server:
        weighted: true
        lr: 1.0
name: fluke.algorithms.fedavg.FedAVG
