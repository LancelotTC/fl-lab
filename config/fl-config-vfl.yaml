hyperparameters:
    client:
        batch_size: 256
        local_epochs: 5
        loss: CrossEntropyLoss
        optimizer:
            lr: 0.001
            momentum: 0.9
            weight_decay: 1.0e-03
        persistency: true
        scheduler:
            gamma: 1
            step_size: 1
    model: Medical_VFL
    net_args:
        embedding_dim: 16
        client_hidden_dim: 32
        server_hidden_dim: 64
        output_size: 2
        dropout: 0.1
    server: {}
name: fluke.algorithms.vertical.VerticalFL
